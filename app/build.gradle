plugins {
    id 'com.android.application'
}

android {
    namespace 'org.morpheas.rbdoctor'
    compileSdk 35

    defaultConfig {
        applicationId 'org.morpheas.rbdoctor'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
